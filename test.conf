server {
    listen 8080;
    server_name localhost;
    root YoupiBanane;

    location / {
        limit_except GET;
        index youpi.bad_extension;
        cgi_pass .bla ./cgi_test;
    }

    location /post_body {
        limit_except POST;
        client_max_body_size 100;
    }

