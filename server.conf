
server {
    listen      3334;
    server_name localhost;

    root  www;
    index index.html;
    client_max_body_size 10000000;

    # Error pages
    error_page 400 /error_pages/400.html;
    error_page 403 /error_pages/403.html;
    error_page 404 /error_pages/404.html;
    error_page 405 /error_pages/405.html;
    error_page 411 /error_pages/411.html;
    error_page 413 /error_pages/413.html;
    error_page 500 502 503 504 /error_pages/50x.html;

    location /error_pages {
        root     www;
        internal;
    }

    # Root: static files, GET only
    location / {
        root        www;
        index       index.html;
        limit_except GET;
        autoindex   off;
    }

    #  Images: GET with directory listing
    location /images {
        root      www;
        limit_except GET;
        autoindex on;
    }

    # Files: directory listing demo
    location /files {
        root      www;
        limit_except GET;
        autoindex on;
    }

    location /upload {
        root         www/upload;
        upload_store www/upload;
        limit_except GET POST DELETE;
        autoindex    on;
    }

    # ── Python CGI 
    # Files ending in .py under /cgi-bin → executed by python3
    location /cgi-bin {
        root         www/cgi-bin;
        limit_except GET POST;
        cgi_pass     .py /usr/bin/python3;
        cgi_pass     .sh /bin/bash;
    }

    # ── PHP CGI
    location /php {
        root         www/cgi-bin;
        limit_except GET POST;
        cgi_pass     .php /usr/bin/php-cgi;
    }

    # ── Redirect: permanent
    location /old {
        limit_except GET;
        return 301 /;
    }

    # ── Redirect: no code (defaults to 302)
    location /go {
        limit_except GET;
        return /;
    }

    # ── Private: no listing, no upload, GET only → always 403
    location /private {
        root         www/private;
        limit_except GET;
        autoindex    off;
    }
}

# Second server on port 3335
server {
    listen      3335;
    server_name localhost;

    root  www;
    index index.html;

    client_max_body_size 1000000;

    error_page 404 /error_pages/404.html;

    location /error_pages {
        root     www;
        internal;
    }

    location / {
        root        www;
        index       index.html;
        limit_except GET;
        autoindex   off;
    }
}
